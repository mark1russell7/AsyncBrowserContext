packages:
  - "site"
  - "tools/*"

# Our own packages: the release train updates them, so the release age check of pnpm does not apply to them.
minimumReleaseAgeExclude:
  - "@mark1russell7/*"
  - "@procedures/*"

# Fixed versions for the advisories of transitive dependencies (roadmap item C13 of otel-ts).
# @stryker-mutator/core pins minimatch ~10.2.4, typed-rest-client pins qs 6.15.1, and no 10.x of minimatch has the fix.
# The Mutation testing workflow runs Stryker on these versions.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "^11.0.5"
  "qs@>=6.7.0 <6.16.1": "^6.17.1"
  "fast-uri@>=3.0.0 <3.1.9": "^3.1.9"
