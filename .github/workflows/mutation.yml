name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    # Each Sunday and Wednesday at 04:23 UTC. The data stamp of the home page has an age limit of 9 days
    # (scripts/data-stamps.ts), and this schedule meets it also after one failed run. The Pages build reads the newest passed run.
    - cron: "23 4 * * 0,3"

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stryker
        run: pnpm mutation
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
