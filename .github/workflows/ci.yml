name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build, types, Node.js tests, STE lint (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The Babel 8 packages need Node.js 22.18 or later, or 24.11 or later.
        # The matrix has these minimum versions and the newest version of each line.
        node: [22.18.0, 22, 24.11.0, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:node
      - name: Memory tests
        run: pnpm exec vitest run --project memory
      # The writing rules (ASD-STE100) of the README, the documents, the site and the TSDoc comments
      - name: STE lint
        run: pnpm lint:ste
      - name: Tests of the STE linter
        run: pnpm test:ste-lint

  # The function report of the tests (coverage-final.json) for the coverage view of the code atlas: the
  # atlas reads the artifact "coverage" of the newest run on main. The browser tests are not in it.
  coverage:
    name: Coverage (Node.js tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Tests with coverage
        run: pnpm coverage --coverage.reporter=json --coverage.reporter=json-summary --coverage.reporter=text-summary
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser and its system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        run: pnpm exec vitest run --project "browser (${{ matrix.browser }})"

  smoke:
    name: Smoke test (the packed package in a new Vite application)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke

  bundlers:
    name: Build tools (webpack, Rspack, Rollup, esbuild and Next.js, with the packed package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:bundlers

  site:
    name: Site (types, tests and the prerendered build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium and its system dependencies
        run: pnpm --filter ./site exec playwright install --with-deps chromium
      - run: pnpm --filter ./site typecheck
      # The browser tests start the scenarios of the context debugger with the real library
      - run: pnpm --filter ./site test
      - name: Build the site with the prerender
        run: pnpm --filter ./site build
        env:
          SITE_BASE: ${{ github.event.repository.name }}

  babel:
    name: Babel 7.22, the newest Babel 7 and Babel 8 (the packed package)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:babel

  # On a pull request, start the release build on the commit, as the job build of release.yml does: the install, the
  # build, pack.ts and tags.ts of the template. It fails when the release build fails on the same commit, for example
  # when a dependency update changes a shipped file and the version is already on npm. The release on main then stops,
  # so this job finds the fault before the merge. The template keeps the code (actions/release-check), at the same
  # template commit as the job build of release.yml. The Node.js version is the default of both: 26.
  release-check:
    name: release-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mark1russell7/template/.github/actions/release-check@4466542421ef76bcb3ccf5b5e1765d4f509f8f4f # main
