# The security scans of this repository: dependency review, osv-scanner and CodeQL (CI.md of
# mark1russell7/template). A pull request fails only for a new finding at or above high. Pushes to
# main and the weekly scan upload the findings to the Security tab.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-ok:
    name: Security OK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: mark1russell7/template/.github/actions/security-scan@9663f978520a3cd55fe3d5823edb673753d0025a # main
