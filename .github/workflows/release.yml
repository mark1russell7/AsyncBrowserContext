# The standard npm release of a repository made from mark1russell7/template.
#
#   verify    The gates of ci.yml.
#   build     Builds and packs each published package (scripts/release/pack.mjs), and writes the
#             plan of the git tags and the GitHub releases (scripts/release/tags.mjs).
#   publish   Publishes each tarball whose version npm does not have. Only this job holds
#             "id-token: write", and it runs no code of the repository: no checkout, no install.
#   tag       Makes a git tag and a GitHub release for each version that publish published. Only
#             this job holds "contents: write", and it also runs no code of the repository: gh
#             creates each tag on GitHub, from the data of the plan.
#
# A release: change the version in a package.json and merge it to main. The workflow also starts
# by hand (workflow_dispatch), for example to publish again after a failure. It skips each
# version that is already on npm.
#
# npm trusted publishing uses the OIDC token of GitHub Actions: no npm token, and each version
# gets a provenance statement. The trusted publisher of each package names this repository and
# the workflow file release.yml, with NO environment (npm refused an environment for a repository
# with the immutable OIDC subject, npm/cli#9969). A version with a hyphen (1.2.0-rc.1) gets the
# dist-tag "next". The others get "latest".
#
# npm trusts a workflow only for a package that exists. The owner bootstraps a new package once:
# scripts/release/npm-bootstrap.mjs (RELEASING.md tells the procedure). Without it, this workflow
# publishes the other packages and then fails with the names of the new ones.
#
# The git tag of a version is "v<version>" in a repository with one published package, else
# "<name>@<version>" (the convention of Changesets). Its GitHub release has the section of the
# version in the CHANGELOG.md of the package. A tag ruleset of the repository must not block the
# creation of tags by GitHub Actions (RELEASING.md).
name: Release

on:
  push:
    branches: [main]
    paths: ["package.json", "packages/*/package.json"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and pack
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release installs from the registry and the lockfile only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The build script of the root package.json, or else the build script of each package
      - name: Build
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            pnpm run build
          else
            pnpm -r --if-present run build
          fi
      - run: node scripts/release/pack.mjs "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
      # The tag, the prerelease flag and the release text of each published package, for the tag job
      - run: node scripts/release/tags.mjs "$RUNNER_TEMP/tags.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tags
          path: ${{ runner.temp }}/tags.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    outputs:
      # The versions that this run published, "name@version" with a space between them
      published: ${{ steps.publish.outputs.published }}
    steps:
      # No registry-url: with it, setup-node writes `_authToken=${NODE_AUTH_TOKEN}` to an .npmrc,
      # and that empty token can stop the OIDC exchange. The default registry is npmjs.org.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: npm is 11.5.1 or later
        run: |
          npm_version="$(npm --version)"
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$npm_version"; then
            echo "::error::npm $npm_version cannot do trusted publishing. It must be 11.5.1 or later."
            exit 1
          fi
          echo "npm $npm_version"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # packages.txt has one line for each tarball, "name version file", in the sequence of their
      # dependencies. npm publishes each tarball as it is, with no package scripts. The path starts
      # with ./ because npm reads "release/x.tgz" as a GitHub repository (user/repo).
      # npm limits the requests of one account (HTTP 429), and Sigstore can fail once (a 502, then
      # a 409 for the entry that it wrote). npm does not send a request again by itself here: the
      # step waits, and then starts a new publish with a new signature.
      # The query string of each request goes around the cache of the registry. Without it, a
      # package that the owner bootstrapped some minutes before can still get a cached 404. The
      # registry itself can also need some minutes for a new package, so a 404 gets 5 more tries,
      # 30 seconds apart, before the step counts the package as new.
      # The output "published" tells the tag job which versions this run published. The trap writes
      # it also when the step stops with an error after some publishes.
      - name: Publish
        id: publish
        shell: bash
        run: |
          set -o pipefail
          published=()
          trap 'echo "published=${published[*]}" >> "$GITHUB_OUTPUT"' EXIT
          new_packages=()
          while read -r name version file; do
            [ -n "$name" ] || continue
            for try in 1 2 3 4 5 6; do
              status=$(curl -sS -o packument.json -w '%{http_code}' "https://registry.npmjs.org/${name//\//%2f}?t=$(date +%s%N)")
              [ "$status" = "404" ] && [ "$try" != 6 ] || break
              echo "The registry gives 404 for $name. The next look starts in 30 seconds."
              sleep 30
            done
            if [ "$status" = "404" ]; then
              new_packages+=("$name")
              continue
            elif [ "$status" != "200" ]; then
              echo "::error::The registry gave HTTP $status for $name."
              exit 1
            fi
            if node -e 'process.exit(require("./packument.json").versions?.[process.argv[1]] ? 0 : 1)' "$version"; then
              echo "$name $version is on npm."
              continue
            fi
            tag=latest
            case "$version" in *-*) tag=next ;; esac
            for attempt in 1 2 3; do
              if npm publish "./release/$file" --access public --provenance --tag "$tag" --fetch-retries 0 2>&1 | tee publish.log; then
                break
              fi
              if ! grep -qE "E429|E5[0-9][0-9]|TLOG_CREATE_ENTRY_ERROR|ETIMEDOUT|ECONNRESET" publish.log || [ "$attempt" = 3 ]; then
                echo "::error::npm did not publish $name $version."
                exit 1
              fi
              echo "npm or Sigstore gave a temporary error (429, 5xx, or a transparency-log conflict). The next try starts in $((attempt * 60)) seconds."
              sleep $((attempt * 60))
            done
            published+=("$name@$version")
          done < release/packages.txt
          if [ ${#new_packages[@]} -gt 0 ]; then
            echo "::error::These packages are not on npm: ${new_packages[*]}. The owner bootstraps each new package once (RELEASING.md), then starts this workflow again."
            exit 1
          fi

  tag:
    name: Git tag and GitHub release
    needs: [build, publish]
    # Also after a failed publish: each version that it published before the failure gets its tag.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tags
          path: tags
      # tags.json comes from the build job: the name, version, tag, prerelease flag and release text
      # of each published package. This step gives that data to gh and jq only as arguments and files.
      # The commit of a tag never comes from that data:
      #   - A version that this run published gets the commit of this run.
      #   - A different version gets a tag only when npm has it with a provenance statement of this
      #     repository (the repository ID), for example after a run that stopped before its tags.
      #     The tag goes on the commit that the statement names: the commit that the version came from.
      #   - A version without such a statement (a publish by hand) gets no tag.
      # A tag that exists is skipped, so a second run does no harm. gh creates the tag on GitHub.
      #
      # GitHub refuses (HTTP 403) a tag from the workflow token on a commit whose workflow files differ
      # from the workflow files of each branch: that token cannot change workflows. Thus an old commit
      # gets no tag after a change of a workflow, for example after a repository copies this file.
      # For a version of this run, the job then fails. For a different version, it gives a warning.
      # Each time, the summary of the run has the gh command that makes the release with the token of
      # the owner.
      - name: Tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -o pipefail
          # The commit of the npm provenance statement of a version, when this repository published it
          provenance_commit() {
            local status
            status=$(curl -sS -o attestations.json -w '%{http_code}' "https://registry.npmjs.org/-/npm/v1/attestations/${1//\//%2f}@$2") || return 1
            [ "$status" = 404 ] && return 0
            if [ "$status" != 200 ]; then
              echo "The registry gave HTTP $status for the attestations of $1@$2." >&2
              return 1
            fi
            jq -r 'first(.attestations[]? | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle.dsseEnvelope.payload) // empty' attestations.json |
              base64 -d |
              jq -r --arg id "$REPOSITORY_ID" '.predicate.buildDefinition | select(.internalParameters.github.repository_id == $id) | .resolvedDependencies[0].digest.gitCommit // empty'
          }
          plan=tags/tags.json
          count=$(jq length "$plan")
          failed=0
          for ((i = 0; i < count; i++)); do
            name=$(jq -r ".[$i].name" "$plan")
            version=$(jq -r ".[$i].version" "$plan")
            tag=$(jq -r ".[$i].tag" "$plan")
            prerelease=$(jq -r ".[$i].prerelease" "$plan")
            jq -r ".[$i].notes" "$plan" > notes.md
            # Only the characters of an npm name and a version, and no hyphen at the start (a flag of gh)
            if ! [[ "$tag" =~ ^[A-Za-z0-9@][A-Za-z0-9@._/+-]*$ ]]; then
              echo "::error::The tag \"$tag\" of $name has a character that is not correct."
              exit 1
            fi
            if response=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
              echo "The tag $tag exists."
              continue
            elif ! grep -q "HTTP 404" <<<"$response"; then
              echo "::error::GitHub gave an error for the tag $tag: $response"
              exit 1
            fi
            case " $PUBLISHED " in
              *" $name@$version "*)
                target=$GITHUB_SHA
                ours=true
                ;;
              *)
                if ! target=$(provenance_commit "$name" "$version"); then
                  echo "::error::The provenance statement of $name $version is not available."
                  exit 1
                fi
                if [ -z "$target" ]; then
                  echo "$name $version: this run did not publish it, and npm has no provenance statement of this repository for it. It gets no tag."
                  continue
                fi
                echo "$name $version: npm has it from the commit $target of this repository, and it has no tag."
                ours=false
                ;;
            esac
            if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The commit \"$target\" of $tag is not a full SHA."
              exit 1
            fi
            flags=()
            if [ "$prerelease" = true ]; then flags=(--prerelease --latest=false); fi
            if output=$(gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$target" --title "$tag" --notes-file notes.md "${flags[@]}" 2>&1); then
              echo "$output"
              continue
            fi
            if ! grep -q "HTTP 403" <<<"$output"; then
              echo "::error::gh did not make the release $tag: $output"
              exit 1
            fi
            # The workflow token cannot tag this commit. The summary gives the command for the owner.
            message="GitHub refused the tag $tag on $target (HTTP 403): the workflow files of that commit differ from those of each branch. The summary of the run has the command for the owner."
            if [ "$ours" = true ]; then
              echo "::error::$message"
              failed=1
            else
              echo "::warning::$message"
            fi
            {
              echo "### GitHub refused the tag \`$tag\`"
              echo
              echo "The workflow token cannot tag $target. Start this command with your own token:"
              echo
              echo '~~~~sh'
              echo "gh release create '$tag' --repo $GITHUB_REPOSITORY --target $target --title '$tag'${flags[*]:+ ${flags[*]}} --notes-file - <<'NOTES'"
              cat notes.md
              echo 'NOTES'
              echo '~~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
