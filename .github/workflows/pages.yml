# Builds the documentation website (site/) and publishes it to GitHub Pages, with the shared Pages workflow of
# mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
# A pull request builds and checks the site in a browser, with no deploy.
# Each build measures the numbers of the home page, the performance page and the results page again.
# The freshness gate holds them (data-stamps).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
  # Each day, so the measured numbers of the site are at most one day old
  schedule:
    - cron: "17 6 * * *"

permissions: {}

# One deployment at a time. A newer push waits until the running build and deployment are complete.
# Each pull request has its own group, and a newer push cancels its run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@4466542421ef76bcb3ccf5b5e1765d4f509f8f4f # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      node-version: "24"
      # The build renders each page and each Open Graph image in Chromium (site/build/prerender.ts).
      # The site uses the source of the library, so a separate build of the library is not necessary.
      # The build measures the benchmarks, the size and the browser benchmark in this run, starts the browser tests
      # in the three engines (site:data --browsers), and gets the newest Stryker report (mutation.yml).
      # The data files then name these runs, and site:stamps writes the data stamps from them.
      build: |
        pnpm --filter ./site exec playwright install --with-deps chromium firefox webkit
        pnpm bench
        pnpm bench:size
        pnpm bench:browsers
        pnpm mutation:run
        pnpm site:data --browsers
        pnpm --filter ./site build
        pnpm site:stamps
      # mutation:run reads the Actions runs and downloads the Stryker report with this token (the permission actions: read).
      github-token: true
      timeout-minutes: 45
      out: site/dist
      # SITE_URL gives the absolute URL of the site, for the canonical links, Open Graph and the sitemap.
      env: '{"SITE_BASE": "${{ github.event.repository.name }}", "SITE_URL": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"}'
      deploy: ${{ github.event_name != 'pull_request' }}
      # The site-pages action adds the Releases page and the Status page to the built site.
      # The repository has no roadmap file, so the Status page shows the open pull requests and issues.
      site-pages: true
      packages: async-browser-context
      site-name: async-browser-context
      # The check opens each page in a browser at each width, in light and dark. The probe drives the first page:
      # the playground, with the real library. The check reads the TypeScript source and removes its types.
      site-check: true
      site-check-pages: /explore/playground/,/,/releases/,/status/
      site-check-probe: site/src/check-probe.ts
      # The freshness gate: data older than its limit, or measured on an old version of the package, stops the deploy.
      data-stamps: site/dist/data-stamps.json
