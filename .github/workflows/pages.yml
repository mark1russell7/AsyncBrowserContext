# Builds the documentation website (site/) and publishes it to GitHub Pages.
# To publish, set the Pages source of the repository to "GitHub Actions"
# (Settings > Pages). Until then, the workflow only builds the site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push cancels a deployment that waits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build renders each page and each Open Graph image in Chromium (site/build/prerender.ts)
      - name: Install Chromium and its system dependencies
        run: pnpm --filter ./site exec playwright install --with-deps chromium

      # The site uses the source of the library, so a separate build of the library is not necessary
      - name: Build the site
        run: pnpm --filter ./site build
        env:
          SITE_BASE: ${{ github.event.repository.name }}
          # The absolute URL of the site, for the canonical links, Open Graph and the sitemap
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    # Only when the repository has Pages. The build job above still examines the site.
    if: ${{ github.event.repository.has_pages }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
